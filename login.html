<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <title>Login | Mental Health Support</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/auth.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="auth-card text-center">
    <h2>🤍 Welcome Back</h2>
    <p class="subtitle mb-4">You are not alone</p>

    <!-- Email -->
    <div class="mb-3 text-start">
        <label class="form-label">Email</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control" placeholder="Enter your email">
        </div>
        <small id="emailError" class="text-danger"></small>
    </div>

    <!-- Password (EXACT SAME AS SIGNUP) -->
    <div class="mb-3 text-start">
        <label class="form-label">Password</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="Enter password">
        </div>
        <small id="passwordError" class="text-danger"></small>
    </div>

    <button id="loginBtn" class="btn btn-primary w-100 mt-3">
        Login
    </button>

    <p id="msg" class="mt-3"></p>

    <p class="switch mt-3">
        Don’t have an account?
        <a href="/signup">Create one</a>
    </p>
</div>

<script>
// ================= VALIDATION =================
function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// Live email validation
$("#email").on("input", function () {
    const email = $(this).val().trim();

    if (!email) {
        $("#emailError").text("Email is required");
    } else if (!isValidEmail(email)) {
        $("#emailError").text("Please enter a valid email address");
    } else {
        $("#emailError").text("");
    }
});

// Live password validation
$("#password").on("input", function () {
    if (!$(this).val().trim()) {
        $("#passwordError").text("Password is required");
    } else {
        $("#passwordError").text("");
    }
});

// ================= LOGIN =================
$("#loginBtn").click(function () {
   
    $("#msg").text("");

    const email = $("#email").val().trim();
    const password = $("#password").val().trim();

    if (!isValidEmail(email) || !password) {
        $("#msg").text("Please fix the errors above").css("color", "red");
        return;
    }

    $.ajax({
        url: "http://127.0.0.1:5000/login",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({ email, password }),
        success: function () {
            sessionStorage.setItem("email", email);
            window.location.href = "/chat";
        },
        error: function (err) {
            let msg = err.responseJSON ? err.responseJSON.message : "Login failed";
            $("#msg").text(msg).css("color", "red");
        }
    });
});

// Enter key support
$("#email, #password").on("keydown", function (e) {
    if (e.key === "Enter") {
        $("#loginBtn").click();
    }
});
</script>

</body>
</html>
