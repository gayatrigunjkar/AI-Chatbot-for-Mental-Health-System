<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mental Health Chatbot</title>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/chat.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

<div class="chat-container">

  <!-- ================= HEADER ================= -->
  <div class="chat-header">

    <!-- LEFT -->
    <div class="header-left">
      <button id="logoutBtn" class="logout-btn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>

      <div class="music-controls">
        <select id="musicSelect">
          <option value="">Select Music</option>
          <option value="study">📚 Study</option>
          <option value="peace">🌿 Peace</option>
          <option value="meditation">🧘 Meditation</option>
        </select>

        <span id="playIcon">▶</span>
      </div>
    </div>

    <!-- CENTER -->
    <div class="header-center">
      <h2>Mental Health Chatbot</h2>
      <p id="welcome"></p>
    </div>

    <!-- AUDIO -->
    <audio id="calmMusic" loop></audio>

  </div>

  <!-- ================= CHAT BOX ================= -->
  <div id="chatBox" class="chat-box"></div>

  <!-- ================= INPUT ================= -->
  <div class="chat-input">
    <input type="text" id="message" placeholder="Type how you feel..." />
    <button id="sendBtn">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>

</div>

<!-- ================= JS ================= -->
<script>

  /* ===== LOGIN CHECK ===== */
  const email = sessionStorage.getItem("email");
  if (!email) {
    alert("Please login first");
    window.location.href = "/login";
  }
  $("#welcome").text("Welcome, " + email);

  /* ===== CHAT SEND ===== */
  function sendMessage() {
    const msg = $("#message").val().trim();
    if (!msg) return;

    $("#chatBox").append(`<div class="msg user-msg">${msg}</div>`);
    $("#message").val("");

    $.ajax({
      url: "http://127.0.0.1:5000/chat",
      type: "POST",
      contentType: "application/json",
      data: JSON.stringify({ email, message: msg }),
      success: function (res) {
        $("#chatBox").append(`<div class="msg bot-msg">${res.reply}</div>`);
        $("#chatBox").scrollTop($("#chatBox")[0].scrollHeight);
      }
    });
  }

  $("#sendBtn").click(sendMessage);
  $("#message").keydown(function (e) {
    if (e.key === "Enter") sendMessage();
  });

  /* ===== MUSIC CONTROL ===== */
  let playing = false;
  const music = document.getElementById("calmMusic");

  $("#musicSelect").change(function () {
    const selected = $(this).val();
    if (!selected) return;

    music.src = `/music/${selected}.mp3`;
    music.play();

    playing = true;
    $("#playIcon").text("⏸").addClass("active");
  });

  $("#playIcon").click(function () {
    if (!music.src) {
      alert("Please select music first 🎵");
      return;
    }

    if (playing) {
      music.pause();
      $(this).text("▶").removeClass("active");
    } else {
      music.play();
      $(this).text("⏸").addClass("active");
    }
    playing = !playing;
  });

  /* ===== LOGOUT ===== */
  $("#logoutBtn").click(function () {
    music.pause();
    music.currentTime = 0;

    $.ajax({
      url: "http://127.0.0.1:5000/logout",
      type: "POST",
      contentType: "application/json",
      data: JSON.stringify({ email }),
      complete: function () {
        sessionStorage.clear();
        window.location.href = "/login";
      }
    });
  });

</script>

</body>
</html>
