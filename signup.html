<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account | Mental Health Support</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/auth.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="auth-card text-center">
    <h2>🤍 Create Your Account</h2>
    <p class="subtitle mb-4">A safe space for your mental well-being</p>

    <!-- Email -->
    <div class="mb-3 text-start">
        <label class="form-label">Email</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control" placeholder="Enter your email">
        </div>
        <small id="emailError" class="text-danger"></small>
    </div>

    <!-- Password -->
    <div class="mb-2 text-start">
        <label class="form-label">Password</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="Create password">
        </div>
        <small id="passwordError" class="text-danger"></small>
    </div>

    <!-- Password Rules -->
    <div class="password-rules text-start mb-3">
        <small>
            🔐 Password must contain:
            <ul class="mb-0">
                <li>Minimum 8 characters</li>
                <li>1 uppercase letter (A-Z)</li>
                <li>1 lowercase letter (a-z)</li>
                <li>1 number (0-9)</li>
                <li>1 special symbol (@ $ ! % * ? &)</li>
            </ul>
        </small>
    </div>

    <button id="signupBtn" class="btn btn-primary w-100 mt-3">
        Create Account
    </button>

    <p id="msg" class="mt-3"></p>

    <p class="switch mt-3">
        Already have an account?
        <a href="/login">Login here</a>

    </p>
</div>

<script>
// ================= VALIDATION FUNCTIONS =================
function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function isValidPassword(password) {
    return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/.test(password);
}

// ================= LIVE EMAIL VALIDATION =================
$("#email").on("input", function () {
    const email = $(this).val().trim();

    if (!email) {
        $("#emailError").text("Email is required");
    } else if (!isValidEmail(email)) {
        $("#emailError").text("Please enter a valid email address");
    } else {
        $("#emailError").text("");
    }
});

// ================= LIVE PASSWORD VALIDATION =================
$("#password").on("input", function () {
    const password = $(this).val().trim();

    if (!password) {
        $("#passwordError").text("Password is required");
    } else if (!isValidPassword(password)) {
        $("#passwordError").text(
            "Password must include uppercase, lowercase, number, special symbol & 8+ characters"
        );
    } else {
        $("#passwordError").text("");
    }
});

// ================= SIGNUP =================
$("#signupBtn").click(function (e) {
e.preventDefault()
    $("#msg").text("");

    const email = $("#email").val().trim();
    const password = $("#password").val().trim();

    if (!isValidEmail(email) || !isValidPassword(password)) {
        $("#msg").text("Please fix the errors above").css("color", "red");
        return;
    }

    $.ajax({
        url: "http://127.0.0.1:5000/signup",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({ email, password }),
        success: function () {
            $("#msg")
                .text("Account created successfully 🤍 Redirecting to login...")
                .css("color", "green");
                window.location.href = "/login";

           
        },
        error: function (err) {
            let msg = err.responseJSON ? err.responseJSON.message : "Signup failed";
            $("#msg").text(msg).css("color", "red");
        }
    });
});

// Enter key support
$("#email, #password").on("keydown", function (e) {
    if (e.key === "Enter") {
    e.preventDefault()
        $("#signupBtn").click();
    }
});
</script>

</body>
</html>
